<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AniLiberty TV</title><link rel="icon" type="image/png" href="icon.png"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="card-layout.css"><script src="$WEBAPIS/webapis/webapis.js"></script></head><body>
<header><strong>AniLiberty <span>TV</span></strong><nav><button id="latest" class="nav-current" aria-current="page">Новинки</button><button id="continueBtn">Продолжить</button><button id="historyBtn">История</button><button id="favoritesBtn">Избранное</button><button id="accountBtn">Аккаунт</button></nav><div id="headerStatus"><span id="status">Загрузка каталога…</span><span id="syncIndicator" aria-hidden="true"></span></div></header>
<main id="scrollMain"><section id="grid"></section><section id="detail" hidden></section></main>
<div id="player" hidden><object id="avObject" type="application/avplayer"></object><div id="videoArea"></div><div id="playerbar"><span id="playingTitle"></span><div id="progressBox"><div id="progressTrack"><div id="progressFill"></div><div id="progressThumb" aria-hidden="true"></div></div><div id="times"><span id="elapsed">00:00</span><span id="pauseState"></span><span id="total">00:00</span></div></div><span id="skipButton" hidden></span><span id="playerHint">OK / Play-Pause: пауза · ◀/▶: перемотка с ускорением · Назад: выход</span></div></div>
<div id="syncCurtain" role="status" aria-live="polite"><div class="sync-curtain-inner"><div class="sync-curtain-brand">AniLiberty <span>TV</span></div><div class="sync-curtain-spinner" aria-hidden="true"></div><div id="syncCurtainMessage" class="sync-curtain-message">Синхронизация с AniLiberty</div><div id="syncCurtainHint" class="sync-curtain-hint">Получение данных…</div></div></div>
<script src="app.js"></script><script src="card-layout.js"></script></body></html>
